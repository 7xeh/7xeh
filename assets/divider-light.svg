<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" aria-hidden="true">
  <style>.dot{animation:slide 5s ease-in-out infinite alternate}@keyframes slide{to{transform:translateX(400px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#d6136f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d6136f" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a21caf" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11.5" width="1000" height="1" fill="url(#line)"/>
  <circle class="dot" cx="300" cy="12" r="3" fill="#a21caf"/>
</svg>
