name: Notify profile README

on:
  push:
  release:
    types: [published, edited, deleted]
  watch:
    types: [started]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to 7xeh/7xeh
        env:
          TOKEN: ${{ secrets.PROFILE_README_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "PROFILE_README_TOKEN not set; skipping."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/7xeh/7xeh/dispatches \
            -d '{"event_type":"project-updated","client_payload":{"repo":"${{ github.repository }}"}}'
