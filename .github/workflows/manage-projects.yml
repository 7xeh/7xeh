name: Manage projects

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [add, remove, move, summary]
        required: true
      repo:
        description: Repo name (e.g. SpicyThemes)
        type: string
        required: true
      position:
        description: "add/move: 1-based slot (blank = end)"
        type: string
        required: false
      summary:
        description: "add/summary: custom description (blank = use GitHub's)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update projects.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION: ${{ inputs.action }}
          REPO: ${{ inputs.repo }}
          POSITION: ${{ inputs.position }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          set -eu
          cd .github/scripts
          case "$ACTION" in
            add)
              set -- add "$REPO"
              if [ -n "$SUMMARY" ]; then set -- "$@" --summary "$SUMMARY"; fi
              if [ -n "$POSITION" ]; then set -- "$@" --position "$POSITION"; fi
              ;;
            remove)  set -- remove "$REPO" ;;
            move)    set -- move "$REPO" "${POSITION:?position is required for move}" ;;
            summary) set -- summary "$REPO" "$SUMMARY" ;;
          esac
          python manage.py "$@" --render

      - name: Commit
        env:
          ACTION: ${{ inputs.action }}
          REPO: ${{ inputs.repo }}
        run: |
          if git diff --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.toml README.md
          git commit -m "chore(projects): $ACTION $REPO [skip ci]"
          git pull --rebase
          git push
